name: CD

on:
  push:
    branches: [ "deploy", "main" ]

  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compile environment
        run: docker build -t release-sandbox .
      - name: Build release
        run: |
          docker run --rm -v "$PWD":/app -w /app release-sandbox \
            just release-ci
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.pages_url }}
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
