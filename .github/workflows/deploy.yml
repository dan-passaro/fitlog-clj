name: CD

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - uses: Mic92/hestia@main
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Populate nix store
        run: nix develop -c true
      - name: Retrieve app dependencies
        run: nix develop -c just install-deps
      - name: Build fitlog
        run: nix run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.pages_url }}
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
